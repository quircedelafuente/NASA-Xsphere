<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Engine test page</title>
<style>
:root{--ink:#0a0e16;--panel:#111827;--line:#223047;--fg:#e6ebf3;--mute:#8b98ad;--ir:#f0a43a;--cool:#7fb2ff;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--fg);font:14px/1.5 system-ui,sans-serif;padding:16px}
.wrap{max-width:1100px;margin:0 auto;display:grid;gap:14px}
h1{font-size:18px;margin:0}.note{color:var(--mute);font-size:12.5px}
form{display:flex;gap:8px;flex-wrap:wrap}input,select{background:var(--panel);color:var(--fg);border:1px solid var(--line);border-radius:6px;padding:8px}
input#q{flex:1;min-width:220px}button{background:var(--ir);color:#1b1206;border:0;border-radius:6px;padding:8px 14px;font-weight:600;cursor:pointer}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cool);width:0;transition:width .4s}
.grid{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:14px}@media(max-width:800px){.grid{grid-template-columns:1fr}}
.stage{background:#000;border-radius:8px;aspect-ratio:1;position:relative;overflow:hidden}
.stage img{width:100%;height:100%;image-rendering:pixelated;display:block}
.hud{position:absolute;left:8px;top:8px;background:rgba(10,14,22,.8);padding:4px 8px;border-radius:5px;font:12px ui-monospace,monospace}
.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{background:transparent;color:var(--mute);border:1px solid var(--line);font-weight:500}
.chip[aria-pressed=true]{color:var(--fg);border-color:var(--ir)}
pre{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px;font-size:11.5px;overflow:auto;max-height:340px;margin:0}
</style></head><body><div class="wrap">
<h1>SPHEREx engine · developer test page</h1>
<p class="note">Chunk A test page: search → NASA data on demand → merged visits. Not the product UI.</p>
<form id="f"><input id="q" value="Barnard's Star" aria-label="Name or coordinates">
<select id="fov" aria-label="Field of view"><option value="2">2′</option><option value="3" selected>3′</option><option value="5">5′</option></select>
<select id="pv" aria-label="Photos per band per visit"><option>2</option><option selected>4</option><option>6</option></select>
<button>Fetch</button></form>
<div id="status" class="note">Ready.</div><div class="bar"><i id="pbar"></i></div>
<div class="grid"><div style="display:grid;gap:8px">
<div class="stage"><img id="img" alt=""><div class="hud" id="hud"></div></div>
<div class="chips" id="bands"></div><div class="chips"><button class="chip" id="mode" aria-pressed="false">Changes only</button></div></div>
<pre id="info">–</pre></div></div>
<script>
const $=s=>document.querySelector(s); let V=null, band=null, ep=0, diff=false, timer=null;
async function api(p,o){const r=await fetch(p,o); const j=await r.json(); if(!r.ok) throw new Error(j.detail?.message||r.statusText); return j}
$('#f').onsubmit=async e=>{e.preventDefault(); clearInterval(timer); V=null;
  try{ $('#status').textContent='Finding…'; const m=(await api('/resolve?q='+encodeURIComponent($('#q').value))).matches[0];
    $('#status').textContent=`Found ${m.name} (${m.source}). Asking NASA for photos…`;
    const bands=['D4','D5','D6'];   // D1–D3 saturate on bright stars; all six work too
    const {job}=await api('/view',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({ra_deg:m.ra_deg,dec_deg:m.dec_deg,fov_arcmin:+$('#fov').value,per_visit:+$('#pv').value,target_id:m.id||null,bands})});
    const t0=Date.now();
    while(true){ const j=await api('/view/'+job); $('#pbar').style.width=(100*(j.progress||0))+'%';
      $('#status').textContent=`${j.status} · ${Math.round(100*(j.progress||0))}% · ${((Date.now()-t0)/1000).toFixed(0)} s${j.n_photos_used?` · using ${j.n_photos_used} of ${j.n_photos_total} photos`:''}${j.visits_ready?` · ${j.visits_ready} visit(s) ready`:''}`;
      if(j.bands && Object.keys(j.bands).length){V=j; show()}
      if(j.status==='done'||j.status==='error'){ if(j.status==='error') $('#status').textContent='Error: '+j.message; break }
      await new Promise(r=>setTimeout(r,1500)); }
  }catch(err){$('#status').textContent='Error: '+err.message}};
function show(){ const bs=Object.keys(V.bands); if(!band||!bs.includes(band)) band=bs.includes('D4')?'D4':bs[0];
  $('#bands').innerHTML=bs.map(b=>`<button class="chip" data-b="${b}" aria-pressed="${b===band}">${b}</button>`).join('');
  $('#info').textContent=JSON.stringify({center:V.center,visits:V.visits,counts:V.counts,spectrum_points:(V.spectrum||[]).length,stacks:V.stacks_url,key:V.key},null,1);
  clearInterval(timer); timer=setInterval(step,1000); step() }
function step(){ const fr=(diff?V.bands[band].diffs:V.bands[band].frames); const ok=fr.map((f,i)=>f?i:-1).filter(i=>i>=0); if(!ok.length)return;
  ep=ok[(ok.indexOf(ep)+1)%ok.length]; $('#img').src=fr[ep]; const v=V.visits[ep]; $('#hud').textContent=`${band} · visit ${ep+1}/${V.visits.length} · ${v.start}`}
$('#bands').onclick=e=>{const b=e.target.closest('button'); if(b){band=b.dataset.b; show()}};
$('#mode').onclick=()=>{diff=!diff; $('#mode').setAttribute('aria-pressed',diff)};
</script></body></html>
