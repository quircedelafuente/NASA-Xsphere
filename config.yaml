# Shared configuration (owner: Quirce). Adding a SPHEREx release = add it here and re-run inventory + precompute.
spherex:
  collections: [spherex_dr1, spherex_dr1_deep, spherex_qr3, spherex_qr3_deep]   # D3 — never QR2
  s3_bucket: nasa-irsa-spherex
  pixel_arcsec: 6.15
epochs:
  gap_days: 60            # D4
  split_long_groups_by_month: true
grid:                     # D7
  nx: 64
  ny: 64
  pix_arcsec: 6.15
stretch:                  # D8
  method: asinh
  a: 0.1
  percentiles: [0.5, 99.5]
bands:
  default_brown_dwarf: D56
targets_file: data/targets.json
bundles_dir: web/public/bundles
flags:                    # until Data delivers C3 (data/flags.json)
  hard_mask_bits: [6, 9, 10, 11, 17, 19, 25, 27]   # NONFUNC MISSING_DATA HOT COLD PERSIST OUTLIER STREAK SNOWBALL
  saturation_bits: [1, 26]                        # OVERFLOW, BLOOM -> mask layer + warning
change:                   # the "what changed" part (Quirce)
  reference: first        # D18: diffs vs the first epoch (+ consecutive pairs also exported)
  units: sigma            # D19: (Ej-Ei)/sqrt(err_i^2+err_j^2), background scatter rescaled to 1
  sys_frac: 0.1           # 10% systematic floor per pixel (lambda mix inside a band, PSF, calibration)
  candidate_sigma: 5      # D20: |diff| >= 5 sigma -> listed as a change "candidate"
  max_candidates: 20
cache_dir: processing/cache   # raw sections from S3 (gitignored)
