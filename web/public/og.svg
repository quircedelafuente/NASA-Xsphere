  <g transform="translate(80 210)" font-family="Inter, Helvetica, Arial, sans-serif">
    <circle cx="16" cy="-6" r="14" fill="#9aa2b1"/><circle cx="36" cy="-6" r="14" fill="#56b4e9"/>
    <text x="64" y="4" font-size="34" font-weight="700" fill="#e8eaef">SPHEREx Blink</text>
    <text x="0" y="96" font-size="58" font-weight="700" fill="#ffffff">Watch the infrared</text>
    <text x="0" y="166" font-size="58" font-weight="700" fill="#ffffff">sky move.</text>
    <text x="0" y="230" font-size="24" fill="#9aa2b1">A blink comparator for NASA’s SPHEREx all-sky survey.</text>
    <text x="0" y="330" font-size="18" fill="#6b7383">NASA Space Apps Challenge 2026 · not an official NASA product</text>
  </g>
