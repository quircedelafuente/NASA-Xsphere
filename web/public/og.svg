<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <radialGradient id="bg" cx="50%" cy="40%" r="75%"><stop offset="0" stop-color="#0d1424"/><stop offset=".6" stop-color="#070a12"/><stop offset="1" stop-color="#04060b"/></radialGradient>
    <radialGradient id="mw" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#96aad7" stop-opacity=".35"/><stop offset="1" stop-color="#96aad7" stop-opacity="0"/></radialGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffffff"/><stop offset=".35" stop-color="#56b4e9"/><stop offset="1" stop-color="#56b4e9" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <ellipse cx="760" cy="360" rx="560" ry="120" fill="url(#mw)" transform="rotate(-18 760 360)"/>
  <g fill="#e8eaef" opacity=".75">
    <circle cx="640" cy="120" r="2"/><circle cx="1010" cy="90" r="1.6"/><circle cx="880" cy="210" r="2.4"/><circle cx="1110" cy="300" r="1.4"/>
    <circle cx="700" cy="470" r="1.8"/><circle cx="960" cy="520" r="2.2"/><circle cx="1080" cy="430" r="1.5"/><circle cx="590" cy="300" r="1.3"/>
    <circle cx="820" cy="80" r="1.2"/><circle cx="760" cy="560" r="1.4"/><circle cx="1150" cy="170" r="1.8"/><circle cx="660" cy="220" r="1.1"/>
  </g>
  <!-- the blink: same patch, two visits, the star has moved -->
  <g transform="translate(790 190)">
    <rect width="250" height="250" rx="10" fill="#000" stroke="#ffffff" stroke-opacity=".35" stroke-width="2"/>
    <circle cx="112" cy="150" r="30" fill="url(#glow)" opacity=".35"/>
